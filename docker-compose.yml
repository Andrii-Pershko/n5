services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: n5deal
      POSTGRES_PASSWORD: n5deal
      POSTGRES_DB: n5deal
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "3303:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n5deal -d n5deal"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./api
    env_file:
      - ./api/.env
    environment:
      # Host `postgres` is the Compose DNS name; api/.env still uses localhost for npm run start:dev
      DATABASE_URL: postgresql://n5deal:n5deal@postgres:5432/n5deal
      PORT: "4000"
    ports:
      - "3302:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
    env_file:
      - ./web/.env
    ports:
      - "3301:3000"
    depends_on:
      - api

volumes:
  pgdata:
