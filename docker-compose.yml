services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: n5deal
      POSTGRES_PASSWORD: n5deal
      POSTGRES_DB: n5deal
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5003:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n5deal -d n5deal"]
      interval: 5s
      timeout: 5s
      retries: 12

  api:
    build:
      context: ./api
    environment:
      DATABASE_URL: postgresql://n5deal:n5deal@postgres:5432/n5deal
      JWT_SECRET: n5deal-dev-jwt-secret-change-me
      PORT: "4000"
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5005}
    ports:
      - "5001:4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5001}
    ports:
      - "5005:3000"
    depends_on:
      - api

volumes:
  pgdata:
